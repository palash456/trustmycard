# Micro topology for low-RAM VPS (512 MB): backend + wallet only.
# Requires data.mode=external (Neon Postgres + Upstash Redis).
# Admin: run locally. Marketing: static host (Hostinger/CDN).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ${TMC_IMAGE_BACKEND:-tmc/backend:production}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    memswap_limit: 320m
    env_file:
      - ${TMC_COMPILED_ENV_BACKEND:-../compiled/production/backend.env}
    environment:
      TMC_ENV: production
      PORT: "4000"
      NODE_OPTIONS: "--max-old-space-size=192"
      TMC_REPO_ROOT: /opt/tmc
      TMC_CONFIG_DEPLOY_LOCAL: "true"
    volumes:
      - ../adapters:/opt/tmc/deploy/adapters:ro
      - ../config-engine:/opt/tmc/deploy/config-engine:ro
      - ../core:/opt/tmc/deploy/core:ro
      - ../compose:/opt/tmc/deploy/compose:ro
      - ../caddy:/opt/tmc/deploy/caddy:ro
      - ../compiled:/opt/tmc/deploy/compiled:rw
      - ../runtime-config:/opt/tmc/deploy/runtime-config:rw
      - ../manifest.production.json:/opt/tmc/deploy/manifest.production.json:ro
      - ../scripts:/opt/tmc/deploy/scripts:ro
      - ../../config:/opt/tmc/config:ro
      - ../../env/profiles:/opt/tmc/env/profiles:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
    ports:
      - "${TMC_HOST_API_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/v1/api/settings/public').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - tmc

  wallet:
    image: ${TMC_IMAGE_WALLET:-tmc/wallet:production}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 192m
    memswap_limit: 256m
    env_file:
      - ${TMC_COMPILED_ENV_WALLET:-../compiled/production/wallet.env}
    environment:
      TMC_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NODE_OPTIONS: "--max-old-space-size=128"
    ports:
      - "${TMC_HOST_WALLET_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/settings/public').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tmc
