# Copy to deploy/manifest.production.yaml (gitignored) and adjust for your environment.
#
# Local fresh-host test:
#   cp deploy/manifest.production.example.yaml deploy/manifest.production.yaml
#   ./deploy.sh production --fresh --provider local

environment: production
topology: budget # budget | full

provider: local # local | docker-vps (render/hostinger: stubs)

domains:
  wallet: http://localhost:3000
  api: http://localhost:4000
  admin: http://localhost:3002
  marketing: http://localhost:3001

data:
  # bundled: compose starts postgres + redis (safe default for --fresh)
  # external: use DATABASE_URL + REDIS_URL from env/profiles/production/*
  mode: bundled

  bundled:
    postgres_user: trustmycard
    postgres_password: trustmycard_local_deploy
    postgres_db: trustmycard

safety:
  # External DATABASE_URL hostnames that --fresh will refuse without --confirm-external-data
  protected_db_hosts:
    - neon.tech
    - render.com
    - digitalocean.com

images:
  tag: production
  registry_prefix: tmc

compose:
  project_name: tmc-production
